<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Rangoli Time</title>
  <meta name="description" content="Color and make rangoli patterns. A little drawing game for kids.">
  <meta name="theme-color" content="#1A171F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rangoli Time">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><svg viewBox="-100 -100 200 200" aria-hidden="true" id="logo"></svg><span>Rangoli Time</span></div>
    <nav class="tabs" role="tablist" aria-label="Mode">
      <button role="tab" data-mode="color" id="tab-color">Color</button>
      <button role="tab" data-mode="build" id="tab-build">Make</button>
      <button role="tab" data-mode="gallery" id="tab-gallery">Gallery</button>
    </nav>
    <button class="icon-btn" id="soundBtn" aria-label="Sound"></button>
  </header>

  <div class="main" id="main">
    <section class="pick" id="pick">
      <div id="colorTop"><div class="strip" id="designStrip" aria-label="Pick a design"></div></div>
      <div id="buildTop" hidden>
        <div class="steps" id="steps"></div>
        <div class="strip" id="optStrip" aria-label="Pick a piece"></div>
      </div>
    </section>

    <div class="stage" id="stage">
      <svg id="art" viewBox="-100 -100 200 200" aria-label="Rangoli floor"></svg>
      <div class="fx" id="fx"></div>
    </div>

    <section class="ctl" id="ctl">
      <div class="seg" id="scope" role="group" aria-label="How much to color per tap">
        <button id="scopeWhole" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" class="faint"/><g class="solid"><circle cx="12" cy="3.5" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="20.5" cy="12" r="2"/><circle cx="18" cy="18" r="2"/><circle cx="12" cy="20.5" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="3.5" cy="12" r="2"/><circle cx="6" cy="6" r="2"/></g></svg><span>Whole ring</span></button>
        <button id="scopeOne" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" class="faint"/><g class="faint"><circle cx="18" cy="6" r="2"/><circle cx="20.5" cy="12" r="2"/><circle cx="18" cy="18" r="2"/><circle cx="12" cy="20.5" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="3.5" cy="12" r="2"/><circle cx="6" cy="6" r="2"/></g><circle cx="12" cy="3.5" r="2.6" class="solid"/></svg><span>One piece</span></button>
      </div>
      <div class="tray" id="paletteRow" aria-label="Colors"></div>
      <div class="tray" id="stickerRow" hidden aria-label="Stickers"></div>
      <footer class="tools" id="tools">
        <button class="tool" id="undoBtn"><svg viewBox="0 0 24 24"><path d="M9 7H4V2M4.6 7A8.5 8.5 0 1 1 3.5 13"/></svg>Undo</button>
        <button class="tool" id="clearBtn"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Clear</button>
        <button class="tool" id="stkBtn"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>Stickers</button>
        <button class="tool primary" id="saveBtn"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg>Save</button>
      </footer>
    </section>
  </div>

  <section class="gallery" id="gallery" hidden></section>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Saved rangoli">
  <div class="vbadge" id="vBadge"></div>
  <img id="vart" alt="Saved rangoli">
  <div class="vbtns">
    <button id="vKeep" class="primary">Keep working</button>
    <button id="vPic">Save as picture</button>
    <button class="del" id="vDel">Delete</button>
    <button id="vClose">Close</button>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
